name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ***
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - name: Apply the schema in the documented order
        working-directory: backend
        run: |
          python - <<'EOF'
          import os
          import psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          conn.autocommit = True
          cur = conn.cursor()
          for f in ("schema/local_dev.sql", "schema/schema.sql", "schema/api_additions.sql"):
              cur.execute(open(f).read())
          EOF
      - run: python -m pytest tests -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
      - run: flutter pub get
        working-directory: frontend/save-some-ui
      - name: Provide the bundled .env the app loads at boot
        run: cp .env.example .env
        working-directory: frontend/save-some-ui
      - run: flutter analyze
        working-directory: frontend/save-some-ui
      - run: flutter test
        working-directory: frontend/save-some-ui
